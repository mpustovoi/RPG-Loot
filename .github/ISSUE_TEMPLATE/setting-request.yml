name: ⚙ Config Tweak / Предложение настройки
description: Request a tweak to loot balance or rarity / Предложите изменить баланс или редкость добычи
title: "[⚙] "
labels: [tweak]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚙ Config Tweak / Предложение настройки

  - type: textarea
    id: setting
    attributes:
      label: What do you want to tweak? / Что хотите изменить?
      description: Describe the loot behavior or feature you want to adjust / Опишите поведение добычи или особенность, которую хотите изменить
      placeholder: "Example: Reduce chance for legendary diamond drops / Пример: Уменьшить шанс выпадения легендарной алмазной добычи
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why is this important? / Почему это важно?
      description: Why do you think this change is necessary? / Почему вы считаете это изменение нужным?
      placeholder: "Example: Players get OP gear too often / Пример: Игроки слишком часто получают сильное снаряжение"
    validations:
      required: true
